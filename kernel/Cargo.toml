[package]
name = "brightnes-kernel"
version = "0.4.0"
edition = "2021"

[features]
logging = []
serial = []

[dependencies]
crc = "3.3.0"
heapless = {version = "0.9.1", features = ["serde"]}
pc-keyboard = "0.8.0"
pic8259 = "0.11.0"
postcard = {version ="1.1.3", features = ["alloc", "use-crc"]}
serde = {version = "1.0.225", default-features = false, features = ["derive", "alloc"]}
spin = "0.10.0"
uart_16550 = "0.4.0"
x86_64 = "0.15.2"
brightnes-common = { path = "../common" }
fatfs = { git = "https://github.com/rafalh/rust-fatfs.git", rev = "4eccb50d011146fbed20e133d33b22f3c27292e7", default-features = false, features = ["alloc"]}
bitflags = { version = "2.9.4", features = ["serde"] }
